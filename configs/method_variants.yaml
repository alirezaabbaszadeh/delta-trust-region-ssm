variants:
  base:
    model_family: b2s6
    model_config: configs/model_b2s6_1660ti.yaml
    lr_delta_scale: 1.0
    freeze_delta: false
    lado:
      enabled: false
    dtr:
      enabled: false

  fixed_delta:
    model_family: b2s6
    model_config: configs/model_b2s6_1660ti.yaml
    lr_delta_scale: 0.0
    freeze_delta: true
    lado:
      enabled: false
    dtr:
      enabled: false

  lr_only:
    model_family: b2s6
    model_config: configs/model_b2s6_1660ti.yaml
    lr_delta_scale: 0.2
    freeze_delta: false
    lado:
      enabled: false
    dtr:
      enabled: false

  lado:
    model_family: b2s6
    model_config: configs/model_b2s6_1660ti.yaml
    lr_delta_scale: 1.0
    freeze_delta: false
    lado:
      enabled: true
      l_ref: 256
      alpha: 0.5
      warmup_frac: 0.05
      clip_delta_norm: 0.1
      delta_weight_decay: 0.0
    dtr:
      enabled: false

  dtr:
    model_family: b2s6
    model_config: configs/model_b2s6_1660ti.yaml
    lr_delta_scale: 1.0
    freeze_delta: false
    lado:
      enabled: false
    dtr:
      enabled: true
      l_ref: 256
      alpha: 0.0
      eps_ref: 0.05
      search_steps: 12
      sample_stride: 2
      max_positions: 1024

  dtrl:
    model_family: b2s6
    model_config: configs/model_b2s6_1660ti.yaml
    lr_delta_scale: 1.0
    freeze_delta: false
    lado:
      enabled: false
    dtr:
      enabled: true
      l_ref: 256
      alpha: 0.5
      eps_ref: 0.05
      search_steps: 12
      sample_stride: 2
      max_positions: 1024

  transformer_lite:
    model_family: transformer_lite
    model_config_by_task:
      listops: configs/model_transformer_lite_listops_1660ti.yaml
      text: configs/model_transformer_lite_text_1660ti.yaml
      pathfinder: configs/model_transformer_lite_pathfinder_1660ti.yaml
    freeze_delta: false
    lr_delta_scale: 1.0
    fairness_target_plus_minus: 0.10
    lado:
      enabled: false
    dtr:
      enabled: false

  s4d_lite:
    model_family: s4d_lite
    model_config_by_task:
      listops: configs/model_s4d_lite_listops_1660ti.yaml
      text: configs/model_s4d_lite_text_1660ti.yaml
      pathfinder: configs/model_s4d_lite_pathfinder_1660ti.yaml
    freeze_delta: false
    lr_delta_scale: 1.0
    fairness_target_plus_minus: 0.10
    lado:
      enabled: false
    dtr:
      enabled: false

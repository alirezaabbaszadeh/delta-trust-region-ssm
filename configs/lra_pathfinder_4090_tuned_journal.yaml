task: pathfinder
seq_len: 1024
batch_size: 120
epochs: 3
lr: 0.0003
weight_decay: 0.01
train_size: 160000
val_size: 20000
test_size: 20000
vocab_size: 257
num_classes: 2
pad_token_id: 0
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 4
raw_root: data/raw/lra_official
processed_root: data/processed/lra_official
strict_parity: true
enforce_no_overlap: true
max_cross_split_overlap_ratio: 0.01
enforce_param_budget: true
param_budget_tolerance: 0.1
spike_ratio: 2.0
spike_window: 10
collapse_margin: 0.05
collapse_patience: 3
